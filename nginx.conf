user www-data; 
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;

        ##
        # Gzip Settings
        ##

        gzip on;

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##
        server {
                listen 80;
                server_name joy4giving.cn www.joy4giving.cn;
                add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload';
                return 301 https://joy4giving.cn$request_uri;
        }

        server {
                #listen 443 ssl http2;
                #listen [::]:443 ssl http2;

                listen 443 ssl;
                listen [::]:443 ssl;

                server_name joy4giving.cn www.joy4giving.cn;

                ssl_certificate     /etc/nginx/certs/joy4giving/joy4giving.cn.pem;
                ssl_certificate_key /etc/nginx/certs/joy4giving/joy4giving.cn.key;
                # ssl_session_timeout 1d;
                ssl_session_cache shared:SSL:10m;

                ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
                # ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
                # ssl_prefer_server_ciphers on;
                ssl_dhparam /etc/nginx/certs/joy4giving/dhparam.pem;

                # HSTS
                add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload';
                add_header X-Frame-Options SAMEORIGIN;
                # No iframe usage
                add_header X-Frame-Options DENY;


                location / {
                        root /opt/csr-app/;
                        index index.html;
                        try_files $uri $uri/ /index.html;
                }

                location /admin {
                        alias /opt/csr-admin/;
                        index index.html;
                        try_files $uri $uri/ /admin/index.html;
                }

                location ^~/api/ {
                      proxy_pass http://127.0.0.1:8080/api/;
                      proxy_hide_header Upgrade;
                }

                location /static/img/ {
                      proxy_pass http://static.liyacn.top/csr/;
                      proxy_hide_header Upgrade;
                }


        }

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
}
